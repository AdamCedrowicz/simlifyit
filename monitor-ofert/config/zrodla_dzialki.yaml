# Źródła działek. Typy: listing (ogólny parser list), otodom (__NEXT_DATA__), manual (tylko link w mailu).
# listing: urls, link_pattern (regex adresu oferty), render: http|browser, fetch_details, max_details,
#          location (np. powiat – gdy lista jest per powiat), delay_ms.
# Wzorce są wstępne: nie dało się ich sprawdzić na żywo. Uruchom workflow w trybie „probe”,
# a w artefakcie „probe” będą surowe strony i JSON-y do dostrojenia.

zrodla:
  - name: komornik
    type: listing
    render: browser
    urls:
      - https://licytacje.komornik.pl/
    link_pattern: 'licytacje\.komornik\.pl/licytacje/\d+'
    category: grunty
    fetch_details: true
    max_details: 25

  - name: kas-elicytacje
    type: listing
    render: browser
    urls:
      - https://elicytacje.mf.gov.pl/
    link_pattern: 'elicytacje\.mf\.gov\.pl/.*(announcement|ogloszen|obwieszcz|auction)s?/[\w-]{4,}'
    category: grunty
    fetch_details: true
    max_details: 25

  - name: adradar
    type: listing
    urls:
      # Uzupełnić adresami list per powiat: /p/grunty/<id>/<powiat>/licytacje_komornicze
      # (częstochowski, radomszczański, kłobucki, myszkowski, pajęczański). Bieżące oferty są na 1. stronie.
      - https://przetargi.adradar.pl/
    link_pattern: 'przetargi\.adradar\.pl/.*\d{4,}'
    exclude_pattern: '/p/|page='
    category: grunty
    delay_ms: 1500

  - name: otodom
    type: otodom
    delay_ms: 4000
    urls:
      - https://www.otodom.pl/pl/wyniki/sprzedaz/dzialka/slaskie/czestochowski
      - https://www.otodom.pl/pl/wyniki/sprzedaz/dzialka/lodzkie/radomszczanski

  - name: olx
    type: listing
    delay_ms: 3000
    urls:
      - https://www.olx.pl/nieruchomosci/dzialki/sprzedaz/czestochowa/?search%5Bdist%5D=30
    link_pattern: 'olx\.pl/d/oferta/'
    category: grunty

  - name: kowr
    type: listing
    enabled: false          # etap 5
    urls:
      - https://www.kowr.gov.pl/
    link_pattern: 'przetarg|ogloszeni'

  - name: krz-syndycy
    type: manual            # wyszukiwarka obwieszczeń wymaga formularza – do rozpoznania
    manual_url: https://krz.ms.gov.pl/

# Gminy w okolicy (wstępna lista, ok. 35 km od Jackowa – do sprawdzenia).
