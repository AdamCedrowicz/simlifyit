name: Działki

on:
  schedule:
    # Cron w UTC. Dwa wpisy = 6:30 w Polsce latem i zimą; krok „Godzina w Polsce” przepuszcza właściwy.
    - cron: "30 4 * * *"
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      tryb:
        description: "normal / dry-run (podgląd) / probe (surowe strony do artefaktu) / test-email"
        type: choice
        options: [normal, dry-run, probe, test-email]
        default: dry-run
      zrodlo:
        description: "Tylko źródło o nazwie zawierającej (puste = wszystkie)"
        required: false

concurrency:
  group: monitor-db        # wspólna z garażami: jeden zapis bazy naraz
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      REF_PARCEL_ID: ${{ secrets.REF_PARCEL_ID }}
    steps:
      - name: Godzina w Polsce
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(TZ=Europe/Warsaw date +%H)" = "06" ]; then
            echo "RUN=1" >> "$GITHUB_ENV"
          else
            echo "Pomijam: w Polsce jest $(TZ=Europe/Warsaw date +%H:%M)"; echo "RUN=0" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.RUN == '1'

      - uses: actions/setup-python@v5
        if: env.RUN == '1'
        with:
          python-version: "3.12"
          cache: pip

      - name: Zależności (z Playwright)
        if: env.RUN == '1' && inputs.tryb != 'test-email'
        run: |
          pip install -r requirements.txt -r requirements-browser.txt
          python -m playwright install --with-deps chromium

      - name: Zależności (test e-mail)
        if: env.RUN == '1' && inputs.tryb == 'test-email'
        run: pip install -r requirements.txt

      - name: Monitor działek
        if: env.RUN == '1'
        env:
          ZRODLO: ${{ inputs.zrodlo }}
        run: |
          case "${{ inputs.tryb || 'normal' }}" in
            test-email) python -m monitor test-email; exit 0 ;;
            dry-run)    ARGS="--dry-run" ;;
            probe)      ARGS="--probe" ;;
            *)          ARGS="" ;;
          esac
          if [ -n "$ZRODLO" ]; then ARGS="$ARGS --only-source $ZRODLO"; fi
          python -m monitor dzialki --browser $ARGS

      - name: Artefakt (probe / podgląd raportu)
        if: env.RUN == '1' && (inputs.tryb == 'probe' || inputs.tryb == 'dry-run')
        uses: actions/upload-artifact@v4
        with:
          name: probe-dzialki
          path: probe/
          retention-days: 7

      - name: Zapis bazy
        if: env.RUN == '1' && (inputs.tryb == '' || inputs.tryb == 'normal') && always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monitor.db
          git diff --cached --quiet || { git commit -m "Stan monitora: działki $(date -u +%F)" && git push; }
