name: Garaże

on:
  schedule:
    # 8:00 i 18:00 w Polsce: wpisy dla czasu letniego (UTC+2) i zimowego (UTC+1).
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      tryb:
        description: "normal / dry-run (podgląd) / probe (surowe strony do artefaktu) / test-email"
        type: choice
        options: [normal, dry-run, probe, test-email]
        default: dry-run
      zrodlo:
        description: "Tylko strona o nazwie zawierającej (puste = wszystkie)"
        required: false

concurrency:
  group: monitor-db
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - name: Godzina w Polsce
        run: |
          H=$(TZ=Europe/Warsaw date +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$H" = "08" ] || [ "$H" = "18" ]; then
            echo "RUN=1" >> "$GITHUB_ENV"
          else
            echo "Pomijam: w Polsce jest $(TZ=Europe/Warsaw date +%H:%M)"; echo "RUN=0" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.RUN == '1'

      - uses: actions/setup-python@v5
        if: env.RUN == '1'
        with:
          python-version: "3.12"
          cache: pip

      - name: Zależności
        if: env.RUN == '1'
        run: |
          pip install -r requirements.txt
          # Playwright tylko wtedy, gdy któraś strona ma "render": "browser"
          if grep -q '"render": *"browser"' config/strony_garaze.json; then
            pip install -r requirements-browser.txt && python -m playwright install --with-deps chromium
            echo "BROWSER=--browser" >> "$GITHUB_ENV"
          fi

      - name: Monitor garaży
        if: env.RUN == '1'
        env:
          ZRODLO: ${{ inputs.zrodlo }}
        run: |
          case "${{ inputs.tryb || 'normal' }}" in
            test-email) python -m monitor test-email; exit 0 ;;
            dry-run)    ARGS="--dry-run" ;;
            probe)      ARGS="--probe" ;;
            *)          ARGS="" ;;
          esac
          if [ -n "$ZRODLO" ]; then ARGS="$ARGS --only-source $ZRODLO"; fi
          python -m monitor garaze $BROWSER $ARGS

      - name: Artefakt (probe)
        if: env.RUN == '1' && inputs.tryb == 'probe'
        uses: actions/upload-artifact@v4
        with:
          name: probe-garaze
          path: probe/
          retention-days: 7

      - name: Zapis bazy
        if: env.RUN == '1' && (inputs.tryb == '' || inputs.tryb == 'normal') && always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monitor.db
          git diff --cached --quiet || { git commit -m "Stan monitora: garaże $(date -u +%F)" && git push; }
